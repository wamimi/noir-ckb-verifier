[workspace]
resolver = "2"
members = ["crates/artifact-adapter", "crates/ckb-integration-tests"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wamimi/noir-ckb-verifier"

[workspace.dependencies]
ark-bn254 = { version = "0.5", features = ["curve"] }
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-serialize = "0.5"
ark-snark = "0.5"
ckb-hash = "1.1"
clap = { version = "4.5", features = ["derive"] }
groth16-schema = { git = "https://github.com/CECILIA-MULANDI/groth16-ckb", rev = "d64c769ffe2d2edb5eb308dc59058efda77c2f83" }
hex = "0.4"
molecule = { version = "0.9", default-features = false, features = ["std"] }
num-bigint = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
verifier-core = { git = "https://github.com/CECILIA-MULANDI/groth16-ckb", rev = "d64c769ffe2d2edb5eb308dc59058efda77c2f83" }
wire-decode = { git = "https://github.com/CECILIA-MULANDI/groth16-ckb", rev = "d64c769ffe2d2edb5eb308dc59058efda77c2f83" }
